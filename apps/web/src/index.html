<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <title>Payana — Local rides along the Karavali coast</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Find a verified local auto, taxi or tour driver in Gokarna. Compare real quotes, book ahead or ride now, and pay the driver directly."
    />
    <meta name="theme-color" content="#fbf7f0" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Payana — Local rides along the Karavali coast" />
    <meta
      property="og:description"
      content="Verified local autos, taxis and tour drivers in Gokarna. Compare quotes and book."
    />

    <!--
      Google Analytics / Google Ads / AdSense are NOT hard-coded here on purpose.
      They are loaded at run time by AnalyticsService, only when an ID has been
      configured (Admin -> Settings -> Analytics & Ads, or public/app-config.json)
      and the visitor has consented. See specs/features/F-14-analytics-and-ads.md.
    -->

    <style>
      /* Shown until the app has started, so a slow connection never sees a blank page. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fbf7f0;
      }
      #boot svg {
        width: 72px;
        height: 72px;
        animation: boot-turn 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div id="boot" role="status" aria-label="Loading Payana">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" fill="#fffdf8" stroke="#1f1a14" stroke-width="2.5" />
          <circle cx="20" cy="18" r="8.5" fill="#f2a81d" stroke="#1f1a14" stroke-width="2.2" />
          <path
            d="M3.2 24.5c3.4-2.6 6.2-2.6 9.4 0s6.2 2.6 9.4 0 6.2-2.6 9.4 0c2 1.6 3.8 2.2 5.6 1.9A18.5 18.5 0 0 1 3.2 24.5z"
            fill="#27624a"
            stroke="#1f1a14"
            stroke-width="2.2"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </app-root>
    <noscript>Payana needs JavaScript to find you a ride. Please enable it and reload.</noscript>
  </body>
</html>
