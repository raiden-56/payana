version: 2

# Weekly, Monday morning IST. Minor and patch updates arrive as one grouped
# pull request per package; major updates arrive individually so each gets
# read. Security updates are raised immediately regardless of this schedule.
#
# TypeScript is held on its current minor line everywhere: Angular fixes the
# TypeScript range it supports, and the repository stays on one compiler.
# Move it deliberately, together with `ng update`.

updates:
  - package-ecosystem: npm
    directory: /packages/contracts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, contracts]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 8
    labels: [dependencies, api]
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 8
    labels: [dependencies, web]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "@angular-eslint/*"
          - "angular-eslint"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Angular majors need the code migrations that `ng update` runs.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]

  # Base image of the API container.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: [dependencies, api]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/*
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: [dependencies, infrastructure]
    groups:
      terraform:
        patterns: ["*"]
