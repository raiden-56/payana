info:
  contact: {}
  description: Hyperlocal mobility and travel marketplace API. Request and response schemas are generated from the shared
    contract package (`packages/contracts`). Errors are RFC 9457 problem documents.
  title: Payana API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/ad-campaigns:
    get:
      operationId: AdminPromotionsController_campaigns
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AdCampaign"
                type: array
          description: ""
        4XX:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Problem details (application/problem+json)
      security:
        - bearer: []
      summary: Advertisement campaigns with their statistics
      tags:
        - admin
    post:
      operationId: AdminPromotionsController_createCampaign
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdCampaignInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdCampaign"
          description: ""
        4XX:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Problem details (application/problem+json)
      security:
        - bearer: []
      summary: Create a campaign
      tags:
        - admin
  /api/v1/admin/ad-campaigns/{campaignId}:
    put:
      operationId: AdminPromotionsController_updateCampaign
      parameters:
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdCampaignInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdCampaign"
          description: ""
        4XX:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Problem details (application/problem+json)
      security:
        - bearer: []
      summary: Update a campaign
      tags:
        - admin
  /api/v1/admin/audit-logs:
    get:
      operationId: AdminSettingsController_auditLogs
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                    type: array
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                required:
                  - items
                  - page
                  - pageSize
                  - total
                type: object
          description: ""
        4XX:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Problem details (application/problem+json)
      security:
        - bearer: []
      summary: Search the audit trail
      tags:
        - admin
  /api/v1/admin/bookings:
    get:
      operationId: AdminBookingsController_list
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: "#/components/schemas/AdminBookingRow"
                    type: array
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                required:
                  - items
                  - page
                  - pageSize
                  - total
                type: object
          description: ""
        4XX:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Problem details (application/problem+json)
      security:
        - bearer: []
      summary: Search bookings
      tags:
        - admin
  /api/v1/admin/bookings/{bookingId}:
    get:
      operationId: AdminBookingsController_one
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      responses:
        "200":
